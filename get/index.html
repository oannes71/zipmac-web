<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>집맥 받기</title>
<meta name="description" content="집맥(ZIPMAC) 설치 — 아이폰은 App Store, 안드로이드는 구글 플레이로 바로 보내 드립니다.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://zipmac.co.kr/get">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root{
    color-scheme: light;
    --bg:#F3F5F9; --surface:#FFFFFF; --border:#E7E9EE;
    --ink:#111827; --ink-2:#6B7280;
    --green:#2E7D32;
    --kr:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100dvh; background:var(--bg); color:var(--ink);
    font-family:var(--kr); line-height:1.7; word-break:keep-all;
    display:flex; align-items:center; justify-content:center; padding:24px 16px;
  }
  .card{
    width:100%; max-width:380px; background:var(--surface);
    border:1px solid var(--border); border-radius:16px;
    padding:30px 24px 24px; text-align:center;
    box-shadow:0 1px 2px rgba(17,24,39,.04), 0 18px 40px -28px rgba(17,24,39,.3);
  }
  .logo{width:52px; height:52px; border-radius:12px; display:block; margin:0 auto 14px}
  h1{font-size:21px; font-weight:700; margin:0 0 4px; letter-spacing:-.01em}
  .sub{margin:0 0 22px; font-size:14.5px; color:var(--ink-2)}
  .btns{display:flex; flex-direction:column; gap:10px}
  a.b{
    display:flex; align-items:center; justify-content:center; gap:9px;
    text-decoration:none; font-weight:600; font-size:16px;
    padding:14px 18px; border-radius:11px;
    background:var(--green); color:#fff;
  }
  a.b.ios{background:var(--ink)}
  a.b svg{width:19px; height:19px; flex:none}
  a.b:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  /* **알아본 기기를 위로 올린다.** 자동 이동이 막히거나 감지가 틀려도 두 버튼이 다 보이므로
     막히는 길은 없다. */
  a.b.second{background:var(--surface); color:var(--ink-2); border:1px solid var(--border); font-size:15px}
  .map{
    display:inline-block; margin-top:18px; font-size:14px;
    color:var(--green); font-weight:600; text-decoration:none;
  }
  .map:hover{text-decoration:underline}
  .moving{
    margin:0 0 16px; font-size:13.5px; color:var(--ink-2);
    min-height:20px;
  }
  .foot{margin:20px 0 0; font-size:12.5px; color:var(--ink-2)}
  .foot a{color:var(--ink-2)}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="/zipmac-logo.png" alt="" width="52" height="52">
  <h1>집맥 받기</h1>
  <p class="sub">국토교통부 실거래가를 신고가 중심으로 보여드립니다. 무료 · 회원가입 없음</p>

  <p class="moving" id="moving"></p>

  <div class="btns" id="btns">
    <a class="b" id="android" href="https://play.google.com/store/apps/details?id=kr.co.zipmac">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 2.1c-.3.3-.5.8-.5 1.4v17c0 .6.2 1.1.5 1.4l.1.1 9.5-9.5v-.2L3.7 2.8l-.1-.7z" opacity=".75"/><path d="M16.4 15.9l-3.2-3.2v-.2l3.2-3.2.1.1 3.8 2.1c1.1.6 1.1 1.6 0 2.2l-3.9 2.2z"/><path d="M16.5 15.8L13.2 12.5 3.6 22.1c.4.4 1 .4 1.7.1l11.2-6.4"/><path d="M16.5 9.2L5.3 2.8c-.7-.4-1.3-.3-1.7.1l9.6 9.6 3.3-3.3z" opacity=".55"/></svg>
      Google Play에서 받기
    </a>
    <a class="b ios" id="ios" href="https://apps.apple.com/kr/app/id6819904408">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
      App Store에서 받기
    </a>
  </div>

  <a class="map" href="/map.html">설치 없이 지도만 보기 →</a>

  <p class="foot"><a href="/">집맥 소개</a> · <a href="/privacy.html">개인정보처리방침</a></p>
</div>

<script>
/* **이 페이지는 QR·링크 하나로 두 스토어를 받는 자리다.**
   원칙 둘.
   1) 자동으로 보내되 **두 버튼은 끝까지 남긴다.** 감지가 틀리거나 이동이 막혀도
      사용자가 직접 고를 수 있어야 한다 — 중계가 막다른 길이 되면 안 된다.
   2) 못 알아보면 아무 데도 안 보낸다. 데스크톱에서 스토어 앱 페이지로 튕기면
      아무것도 못 한다. 그때는 두 버튼을 그냥 보여준다. */
(function () {
  var ua = navigator.userAgent || '';
  /* 아이패드는 userAgent에 Macintosh로 찍히므로 터치 지원으로 갈라낸다. */
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
              (/Macintosh/.test(ua) && typeof document.ontouchend !== 'undefined');
  var isAndroid = /Android/.test(ua);
  if (!isIOS && !isAndroid) return;

  var target = isIOS ? document.getElementById('ios') : document.getElementById('android');
  var other  = isIOS ? document.getElementById('android') : document.getElementById('ios');
  var btns   = document.getElementById('btns');

  /* 알아본 쪽을 위로 올리고, 다른 쪽은 조용한 모양으로 낮춘다. */
  btns.insertBefore(target, btns.firstChild);
  other.classList.add('second');

  document.getElementById('moving').textContent =
    (isIOS ? 'App Store' : '구글 플레이') + '로 이동합니다…';

  /* replace를 쓴다 — 뒤로가기가 이 페이지에 갇히지 않게. */
  setTimeout(function () { location.replace(target.href); }, 600);
})();
</script>
<noscript>
  <p style="text-align:center;font-size:13px;color:#6B7280">위 두 버튼 중 쓰시는 폰에 맞는 쪽을 눌러 주세요.</p>
</noscript>
</body>
</html>
